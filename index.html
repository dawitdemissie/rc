<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revenue Cycle Case Review: 20 CPA-level questions</title>
<meta name="description" content="Twenty case-based CPA-level questions on revenue cycle controls: sales order entry, shipping, billing and cash collections.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#1B2730; --muted:#58665F;
  --rule:#D3DCD6; --ledger:#2C6A4E; --ledger-soft:#E3EFE8;
  --pencil:#B3372A; --pencil-soft:#F7E6E3; --focus:#2C6A4E;
  --sans:"Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A17; --surface:#1B2420; --ink:#E3EAE6; --muted:#9BAAA2;
    --rule:#2E3A35; --ledger:#72C29A; --ledger-soft:#1F3329;
    --pencil:#EE8576; --pencil-soft:#3A2220; --focus:#72C29A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A17; --surface:#1B2420; --ink:#E3EAE6; --muted:#9BAAA2;
  --rule:#2E3A35; --ledger:#72C29A; --ledger-soft:#1F3329;
  --pencil:#EE8576; --pencil-soft:#3A2220; --focus:#72C29A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px}
.mast h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1.15;margin:0}
.mast p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.theme-btn{background:none;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.85rem;white-space:nowrap}

/* Start */
.start{max-width:680px}
.start h2{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin:0 0 12px;line-height:1.25}
.start p{font-family:var(--serif);font-size:1.08rem;line-height:1.65;margin:0 0 14px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:22px 0;background:var(--surface)}
.legend div{padding:12px 14px;border-right:1px solid var(--rule)}
.legend div:last-child{border-right:none}
.legend b{display:block;font-size:1.5rem;font-weight:600}
.legend span{color:var(--muted);font-size:.88rem}
.check{display:flex;align-items:center;gap:10px;margin:8px 0 22px;color:var(--muted);font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--ledger)}

.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ledger);background:var(--ledger);color:var(--surface);
  font-weight:600;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ledger)}

/* Layout */
.board{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr;gap:20px}}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:820px){.side{position:static}}
.side h3{font-size:.9rem;font-weight:600;margin:0 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:820px){.grid{grid-template-columns:repeat(10,1fr)}}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;
  font-size:.82rem;font-weight:600;color:var(--muted);display:grid;place-items:center;padding:0}
.cell.current{border:2px solid var(--ink);color:var(--ink)}
.cell svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none}
.cell.ok{color:transparent}.cell.bad{color:transparent}
.tally{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px;font-size:.92rem}
.tally div{display:flex;justify-content:space-between;padding:3px 0}
.tally .k{color:var(--muted)}
.finish{margin-top:16px;width:100%;justify-content:center}

/* Question */
.qhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.qhead .topic{color:var(--ledger);font-weight:600}
.qtitle{font-family:var(--serif);font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:600;line-height:1.25;margin:0 0 16px}
.case{font-family:var(--serif);font-size:1.06rem;line-height:1.7;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--ledger);
  border-radius:6px;padding:16px 20px;max-width:72ch}
.case p{margin:0 0 10px}.case p:last-child{margin-bottom:0}
.tablewrap{overflow-x:auto;margin:10px 0 2px}
table.fig{border-collapse:collapse;font-family:var(--sans);font-size:.92rem;min-width:320px;width:100%}
table.fig th,table.fig td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left}
table.fig th{font-weight:600;color:var(--muted)}
table.fig .num{text-align:right}
table.fig tr:last-child td{border-bottom:2px solid var(--ink)}
.ask{font-weight:600;font-size:1.05rem;margin:22px 0 12px;max-width:72ch}

.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:76ch}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .letter{width:28px;height:28px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85rem;color:var(--muted)}
.opt.sel{border-color:var(--ledger);box-shadow:inset 0 0 0 1px var(--ledger)}
.opt.sel .letter{background:var(--ledger);border-color:var(--ledger);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ledger);background:var(--ledger-soft)}
.opt.right .letter{background:var(--ledger);border-color:var(--ledger);color:var(--surface)}
.opt.wrong{border-color:var(--pencil);background:var(--pencil-soft)}
.opt.wrong .letter{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.opt .why{display:block;margin-top:6px;font-size:.9rem;color:var(--muted)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.hint{color:var(--muted);font-size:.85rem}

.verdict{margin-top:22px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:16px 20px;max-width:76ch;
  display:grid;grid-template-columns:44px 1fr;gap:14px;animation:land .35s ease-out}
@keyframes land{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.verdict{animation:none}}
.verdict svg{width:44px;height:44px}
.verdict h4{margin:0 0 6px;font-size:1.05rem}
.verdict.ok h4{color:var(--ledger)}.verdict.bad h4{color:var(--pencil)}
.verdict p{margin:0 0 8px;font-family:var(--serif);font-size:1.02rem;line-height:1.65}
.verdict .src{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin:0}

/* Results */
.results h2{font-family:var(--serif);font-size:1.8rem;font-weight:600;margin:0 0 6px}
.scoreline{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;margin:16px 0 26px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.big{font-family:var(--serif);font-size:4rem;line-height:1;font-weight:600}
.big small{font-size:1.4rem;color:var(--muted);font-weight:400}
.status{font-weight:600;font-size:1.05rem}
.status.pass{color:var(--ledger)}.status.fail{color:var(--pencil)}
.bars{display:grid;gap:12px;max-width:620px;margin-bottom:28px}
.bar{display:grid;grid-template-columns:150px 1fr 56px;gap:12px;align-items:center;font-size:.93rem}
.track{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ledger)}
.missed{list-style:none;padding:0;margin:0 0 24px;max-width:720px}
.missed li{border-top:1px solid var(--rule)}
.missed button{width:100%;text-align:left;background:none;border:none;padding:10px 2px;cursor:pointer;display:flex;gap:12px}
.missed button:hover{color:var(--ledger)}
.missed .n{color:var(--pencil);font-weight:600;min-width:2.5em}
footer{margin-top:48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--rule);padding-top:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>Revenue Cycle Case Review</h1>
      <p>Twenty CPA-level cases on sales order entry, shipping, billing and cash collections</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme">Theme</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Questions are based on the lecture deck “The Revenue Cycle: Sales to Cash Collections.” Use them for study; they are not official AICPA exam content.</footer>
</div>
<script>
const QUESTIONS = [
{
  topic: "Sales order entry", slides: "Slides 6–7",
  title: "Credit overrides at Brightline Supply",
  case: `<p>Brightline Supply sells industrial fasteners to about 1,400 business customers. Its ERP system displays a warning when a new order pushes a customer over its credit limit, but sales representatives, who earn commission on gross sales, can click “Proceed” and release the order.</p><p>During year-end fieldwork, you note that 62% of balances more than 90 days past due belong to customers whose orders were released over their credit limits. The sales manager reviews the aging report each quarter.</p>`,
  ask: "Which control most directly addresses the threat this situation creates?",
  options: [
    { t: "Increase the allowance for doubtful accounts to reflect the higher past-due balances.", w: "This corrects the financial statements after the fact. It is an accounting estimate, not a control that prevents uncollectible sales from being made." },
    { t: "Have the sales manager review the aging report monthly instead of quarterly.", w: "More frequent review is still detective, and the sales function is not independent: it shares the same commission incentive that caused the overrides." },
    { t: "Configure the system to block orders that exceed the credit limit unless a credit department employee, independent of sales, specifically authorizes the sale.", w: "" },
    { t: "Implement a perpetual inventory system so that sales representatives can see available stock before releasing orders.", w: "Inventory availability addresses stockouts, not the risk of selling to customers who cannot pay." }
  ],
  answer: 2,
  explain: "The threat is uncollectible accounts. The deck’s control is to check credit limits and require specific authorization when a sale exceeds the limit. That authorization must come from someone independent of sales, because sales staff are rewarded for volume, not collectibility. A warning that the salesperson can override is not an authorization control at all."
},
{
  topic: "Sales order entry", slides: "Slide 7",
  title: "Order errors through the web portal",
  case: `<p>Corvane Medical takes orders through a customer web portal and a call center. An internal audit sample of 300 orders found that about 3% contained a customer number that does not exist, a blank delivery date, or a quantity far outside the customer’s history (for example, 1,000 cases keyed instead of 10).</p><p>These errors are only discovered when customers call to complain after delivery.</p>`,
  ask: "Which control would best prevent these errors from entering the system?",
  options: [
    { t: "Restrict access to the customer master file so that only the credit department can change customer records.", w: "This protects the accuracy of master data, but the errors here occur when orders are keyed, not in the master file." },
    { t: "Data entry edit controls: a validity check of the customer number against the master file, completeness checks on required fields, and a limit or reasonableness check on quantity.", w: "" },
    { t: "A monthly reconciliation of the accounts receivable subsidiary ledger to the general ledger.", w: "Both ledgers would carry the same wrong order, so the reconciliation would agree. It is also detective, not preventive." },
    { t: "Reconcile each sales invoice to the shipping documents before it is sent.", w: "The invoice and the shipping documents would both be based on the wrong order, so they would match." }
  ],
  answer: 1,
  explain: "Incomplete or inaccurate orders are the first threat listed for sales order entry, and data entry edit controls are the first control. Each error in the case maps to a specific edit check: invalid customer numbers to a validity check, blank fields to a completeness check, and the extra zeros to a limit or reasonableness check."
},
{
  topic: "Sales order entry", slides: "Slides 7 and 9",
  title: "The storage unit address",
  case: `<p>At Halden Distributors, sales clerk Priya Nair has full write access to the customer master file. Over four months she changed the shipping address of a dormant customer, Merritt Hardware, to a self-storage unit, raised Merritt’s credit limit from $5,000 to $60,000, and entered orders in Merritt’s name.</p><p>The goods shipped normally. The fraud surfaced when Merritt Hardware disputed the invoices.</p>`,
  ask: "Which control would most likely have prevented this scheme?",
  options: [
    { t: "Data entry edit controls on the sales order screen, including a validity check on the customer number.", w: "Merritt Hardware is a real customer, so its number passes a validity check. Edit controls check what is keyed, not whether the master data behind it has been tampered with." },
    { t: "Reconciling each picking list to the related sales order before goods leave the warehouse.", w: "The picking list would match the fraudulent sales order exactly." },
    { t: "Reconciling the accounts receivable subsidiary ledger to the general ledger each month.", w: "The fictitious sales were recorded consistently in both ledgers, so the reconciliation would balance." },
    { t: "Restricting the ability to change customer master data (addresses and credit limits) to authorized credit personnel independent of sales, with all changes logged and reviewed.", w: "" }
  ],
  answer: 3,
  explain: "The scheme depended on a sales employee being able to change master data. The deck lists “restrict access to master data to maintain accuracy” as a sales order entry control. It also prevents the shipping threat of shipping to the wrong address, because once the address and credit limit can only be changed by someone else, every downstream document is built on accurate data."
},
{
  topic: "Sales order entry", slides: "Slide 7",
  title: "Back orders and obsolete stock",
  case: `<p>Tamsin Outdoor Gear sells about 3,000 SKUs. It updates inventory records only after an annual physical count. Salespeople check availability by phoning the warehouse.</p><p>During the year, 18% of orders for best-selling items became back orders, and customers moved to competitors. At the same count, $410,000 of slow-moving items were found that management did not know it held.</p>`,
  ask: "Which combination of controls best addresses both problems?",
  options: [
    { t: "A perpetual inventory system updated through bar code or RFID scanning, supplemented by periodic physical counts to correct errors in the records.", w: "" },
    { t: "Tighter credit limits, so that fewer orders are accepted from customers who cannot pay.", w: "Credit limits address uncollectible accounts, not stockouts or excess inventory." },
    { t: "A more closely supervised annual physical count, with test counts by internal audit.", w: "A better annual count improves year-end accuracy but leaves inventory data out of date for the other eleven months." },
    { t: "A bank lockbox, so that cash from customers is available sooner to buy more stock.", w: "A lockbox speeds up collections. It does nothing to show what inventory is on hand." }
  ],
  answer: 0,
  explain: "Stockouts and excess inventory are a sales order entry threat, and the deck pairs them with three controls: a perpetual inventory system, bar code or RFID technology, and physical counts. A perpetual system tells sales what can be promised in real time, scanning keeps it accurate, and periodic counts catch the errors that build up in any record. The missed sales also feed the related threat of losing customers."
},
{
  topic: "Sales order entry", slides: "Slides 6 and 8",
  title: "Year-end cutoff at Ostrava Tools",
  case: `<p>On December 30, Ostrava Tools received a $48,000 order, entered it, and approved the customer’s credit. The goods were picked and staged on the loading dock on December 31. The bill of lading is dated January 2, when the carrier collected the goods. Terms are FOB shipping point, and Ostrava has a December 31 year end.</p>`,
  ask: "Based on the revenue cycle activities in the deck, which statement about Ostrava’s December 31 general ledger is correct?",
  options: [
    { t: "Accounts receivable and sales should be recorded on December 30, because the order was accepted and credit was approved.", w: "Sales order entry is information processing only. The deck states that no general ledger accounts are affected at this stage." },
    { t: "Cost of goods sold should be debited and inventory credited on December 31, because the goods were picked and left the shelves.", w: "Picking moves goods within the company. Inventory is reduced when goods ship, which here is January 2." },
    { t: "No general ledger entries for this order belong in December. The picked goods are still Ostrava’s inventory; inventory, cost of goods sold, receivables and revenue are recorded when the goods ship on January 2.", w: "" },
    { t: "Revenue should be recorded on December 31, because shipment was substantially complete and the delay was the carrier’s.", w: "Under FOB shipping point, control passes when the carrier takes the goods. Revenue cannot be recognized for goods still on the seller’s dock." }
  ],
  answer: 2,
  explain: "The deck notes that sales order entry affects no general ledger accounts, and that inventory is decreased (and cost of sales increased) once goods are shipped. The bill of lading is the evidence of shipment date, so it is the key document in a cutoff test. Recording this sale in December would overstate both revenue and receivables at year end."
},
{
  topic: "Shipping", slides: "Slide 9",
  title: "Wrong quantities at the Riverside warehouse",
  case: `<p>Pell & Barrow Foods ships about 900 orders a day. Warehouse staff read printed picking tickets, pull items from the shelves, and count them by hand. Customer complaints about wrong items or quantities have risen to 4% of orders, and the returns are expensive to process.</p>`,
  ask: "Which control best addresses this threat?",
  options: [
    { t: "Require the shipping supervisor to sign every bill of lading before the carrier departs.", w: "A signature shows that a shipment was released. It does not verify that the right items and quantities are inside." },
    { t: "Scan each item picked with bar code readers, and have the system compare the quantities picked against the picking list and sales order before packing.", w: "" },
    { t: "Separate the shipping function from the billing function.", w: "Segregation here addresses failure to bill. It does not prevent picking errors." },
    { t: "Require credit limit checks before an order is released to the warehouse.", w: "Credit checks address collectibility, not whether the right goods are picked." }
  ],
  answer: 1,
  explain: "Picking the wrong item or quantity is the first shipping threat. The deck lists two controls: bar code technology, and reconciling the picking list to the sales order. Combining them lets the system catch the error at the moment of picking, before the goods are packed and shipped."
},
{
  topic: "Shipping", slides: "Slide 9",
  title: "Shrinkage between the warehouse and the dock",
  case: `<p>At Velde Electronics, inventory shrinkage rose from 0.4% to 2.1% of cost in one year. Warehouse employees, delivery drivers, and temporary staff can all enter the storage area. Goods moved from storage to the shipping dock are not documented, so nobody can say who had custody of a pallet at any point.</p><p>The company already runs a perpetual inventory system.</p>`,
  ask: "Which set of controls best addresses this threat?",
  options: [
    { t: "Upgrade the perpetual inventory system so that it is updated in real time.", w: "Better records show that inventory is missing. They do not prevent anyone from taking it or show who was responsible." },
    { t: "Reconcile every picking list to the related sales order.", w: "This catches picking errors, not goods taken outside the order process." },
    { t: "Apply data entry edit controls to shipping addresses.", w: "Edit controls address shipping to the wrong address, not physical theft." },
    { t: "Restrict physical access to inventory, document every transfer with the signature of the employee receiving custody, and periodically count inventory and reconcile it to recorded quantities.", w: "" }
  ],
  answer: 3,
  explain: "The deck lists three controls for theft in shipping: restrict physical access, document inventory transfers, and perform physical counts reconciled to recorded quantities. Documenting transfers creates accountability, because each employee who signs for goods is responsible for them until the next signature. A perpetual system alone is a record, not a safeguard."
},
{
  topic: "Shipping", slides: "Slide 9",
  title: "Orders left on the dock",
  case: `<p>A quarterly review at Lindqvist Pumps found 37 orders that had been approved and picked but were still staged on the loading dock between 20 and 45 days later. Several customers cancelled and bought elsewhere. Nobody noticed, because no one compares what was ordered with what actually left the building.</p>`,
  ask: "Which control most directly addresses this threat?",
  options: [
    { t: "Regularly reconcile sales orders to the related picking lists, packing slips and bills of lading, and investigate any order that has no matching shipping documents.", w: "" },
    { t: "Use bar code scanning when items are picked.", w: "The orders were picked correctly. The failure happened after picking." },
    { t: "Restrict physical access to the warehouse and loading dock.", w: "Access controls prevent theft. The goods here were not stolen; they were never shipped." },
    { t: "Reconcile the accounts receivable subsidiary ledger to the general ledger.", w: "This finds posting errors. An unshipped order may never reach either ledger." }
  ],
  answer: 0,
  explain: "Failure to ship is the third shipping threat, and the deck’s control is to reconcile shipping documents to sales orders, picking lists and packing slips. An open sales order with no bill of lading after a reasonable period is exactly the exception this reconciliation is designed to surface."
},
{
  topic: "Shipping", slides: "Slide 8",
  title: "The damaged turbines",
  case: `<p>Arkwright Energy shipped two turbines to a customer. They arrived damaged, and the carrier now disputes that it had responsibility for the goods. Separately, the auditors are performing a sales cutoff test and need evidence of the date the goods left Arkwright’s custody.</p>`,
  ask: "Which source document serves both purposes?",
  options: [
    { t: "Packing slip", w: "The packing slip lists the quantity and description of each item in the shipment. It travels with the goods but is not a contract with the carrier." },
    { t: "Picking ticket", w: "The picking ticket authorizes the warehouse to release goods for an order. It is an internal document created before shipping." },
    { t: "Bill of lading", w: "" },
    { t: "Sales invoice", w: "The invoice is a billing document. It is often dated after shipment and does not establish the carrier’s responsibility." }
  ],
  answer: 2,
  explain: "The bill of lading is the legal contract that defines responsibility for goods in transit. It identifies the carrier, the origin, the destination, and the shipment date. This makes it the evidence for a claim against the carrier and the primary document for shipment-date cutoff testing."
},
{
  topic: "Billing", slides: "Slide 11",
  title: "Shipments that were never invoiced",
  case: `<p>At Mosgrove Supply, one clerk prepares shipping documents and also creates the sales invoices. An internal investigation found that the clerk shipped goods to a relative’s business 14 times without ever creating an invoice.</p><p>The monthly reconciliation of the accounts receivable subsidiary ledger to the general ledger has balanced every month.</p>`,
  ask: "Which control would best prevent or detect this?",
  options: [
    { t: "Reconcile the accounts receivable subsidiary ledger to the general ledger weekly instead of monthly.", w: "Sales that were never invoiced are missing from both ledgers, so the reconciliation balances no matter how often it is done. This is why it balanced every month." },
    { t: "Add data entry edit controls to the invoice screen.", w: "Edit controls check invoices that are entered. They cannot detect an invoice that was never created." },
    { t: "Require a customer signature on every sales order.", w: "Signatures address invalid orders. The problem here is goods that left without being billed." },
    { t: "Separate the shipping and billing functions, and reconcile every shipping document to a sales invoice so that any shipment without an invoice is investigated.", w: "" }
  ],
  answer: 3,
  explain: "Failure to bill is the first billing threat, and the deck lists two controls: reconcile invoices with sales orders and shipping documents, and separate shipping and billing. The trap is the subsidiary-to-general ledger reconciliation, which only detects differences between two records of transactions that were recorded. Omitted transactions leave no difference to find."
},
{
  topic: "Billing", slides: "Slide 11",
  title: "Keyed prices and quarterly price changes",
  case: `<p>Billing clerks at Duvall Paper key unit prices onto each invoice from a printed price list that is updated every quarter. A sample of 200 invoices found 11 pricing errors. Most came from clerks using the previous quarter’s list. Quantities on the invoices agreed with the shipping documents in every case.</p>`,
  ask: "Which control best addresses the cause of these errors?",
  options: [
    { t: "Configure the system to enter prices automatically from a price master file that only authorized staff can update.", w: "" },
    { t: "Have a second clerk re-key each price and compare the two entries.", w: "Double keying catches typing mistakes, but both clerks may use the same outdated price list." },
    { t: "Reconcile each invoice to the related shipping documents.", w: "Shipping documents confirm quantities, which were already correct. They carry no price information." },
    { t: "Separate the shipping and billing functions.", w: "Segregation addresses failure to bill, not pricing accuracy." }
  ],
  answer: 0,
  explain: "Billing errors are the second billing threat. The deck’s controls are data entry edit controls and configuring the system to enter price data automatically. Removing manual keying of prices removes the cause. Restricting who can change the price master file keeps that single source accurate."
},
{
  topic: "Billing", slides: "Slide 11",
  title: "The $6,500 difference",
  case: `<p>Sutter & Crane reconciles its accounts receivable subsidiary ledger to the general ledger control account at month end.</p>
  <table class="fig"><tr><th>Source</th><th class="num">Balance</th></tr>
  <tr><td>General ledger control account</td><td class="num">$1,291,100</td></tr>
  <tr><td>Total of customer subsidiary accounts</td><td class="num">$1,284,600</td></tr>
  <tr><td>Difference</td><td class="num">$6,500</td></tr></table>`,
  ask: "Which of the following errors could NOT cause this difference, and so would not be detected by this reconciliation?",
  options: [
    { t: "A $6,500 sales invoice was posted to the general ledger but not to the customer’s subsidiary account.", w: "This leaves the subsidiary ledger $6,500 lower than the general ledger. It explains the difference." },
    { t: "A $6,500 sales invoice was posted for the correct amount, but to the wrong customer’s account.", w: "" },
    { t: "A $6,500 credit memo was posted to the customer’s subsidiary account but never recorded in the general ledger.", w: "This reduces the subsidiary ledger but not the general ledger, which explains the difference." },
    { t: "A $3,250 customer remittance was posted twice to the customer’s account and was not recorded in the general ledger.", w: "This reduces the subsidiary ledger by $6,500 with no change to the general ledger, which explains the difference." }
  ],
  answer: 1,
  explain: "Reconciling the subsidiary ledger to the general ledger is the deck’s control for posting errors in accounts receivable. It only detects errors that make the two totals disagree. Posting to the wrong customer leaves both totals correct, so it is caught by other means, such as monthly statements to customers who then query a charge."
},
{
  topic: "Billing", slides: "Slide 11",
  title: "Credit memos after payment",
  case: `<p>At Fenwick Textiles, the accounts receivable clerk records customer payments and can also create and approve credit memos. You find 23 credit memos for “returned goods,” each issued within three days of the customer’s payment arriving. None is supported by a receiving report, and the customers say they returned nothing.</p>`,
  ask: "Which control would best prevent this?",
  options: [
    { t: "Prenumber credit memos and have the clerk account for the sequence each month.", w: "Prenumbering supports completeness. Here the memos were recorded; they were invalid. The clerk accounting for the sequence is also the person committing the fraud." },
    { t: "Reconcile the accounts receivable subsidiary ledger to the general ledger each month.", w: "The credit memos were posted to both ledgers, so the reconciliation would balance." },
    { t: "Have credit memos authorized by someone independent of accounts receivable and cash handling, such as the credit manager, and require a receiving report for each return.", w: "" },
    { t: "Add data entry edit controls on the credit memo amount field.", w: "Edit controls check format and reasonableness, not whether a return actually happened." }
  ],
  answer: 2,
  explain: "Inaccurate or invalid credit memos are the fourth billing threat. The deck’s control is to segregate the authorization of credit memos from recording them. The pattern of memos issued right after payments arrived is a classic sign of a clerk concealing stolen receipts by writing off the customer balance."
},
{
  topic: "Billing", slides: "Slides 10 and 21",
  title: "Disputes and a month-end crunch",
  case: `<p>Graywell Supply bills about 6,000 commercial customers. Its system applies each payment against the customer’s total balance, so when customers pay some invoices and dispute others, staff cannot tell which invoices are still open. All monthly statements are also produced on the last day of the month, which creates a large overtime spike in billing.</p>`,
  ask: "Which combination best addresses both problems?",
  options: [
    { t: "Adopt the open-invoice method, so that each payment is applied to specific invoices, and use cycle billing to spread statement preparation across the month.", w: "" },
    { t: "Keep the balance-forward method and use cycle billing to spread statement preparation across the month.", w: "Cycle billing fixes the workload, but balance-forward still applies payments to the total balance, so disputed invoices stay hidden." },
    { t: "Adopt the open-invoice method and keep producing all statements at month end.", w: "This fixes payment application but leaves the month-end workload problem." },
    { t: "Keep the balance-forward method and require customers to send orders through EDI.", w: "EDI speeds up order transmission. It changes neither how payments are applied nor when statements are produced." }
  ],
  answer: 0,
  explain: "Under the open-invoice method, customers pay by invoice and each remittance is applied to specific invoices, which makes disputes and partial payments visible. Under the balance-forward method, payments simply reduce the total balance. Cycle billing prepares statements for different groups of customers at different times during the month, which smooths the workload."
},
{
  topic: "Cash collections", slides: "Slide 13",
  title: "Reassigning duties at Pemberton Books",
  case: `<p>Pemberton Books has four finance employees: Kim (cashier), Raj (accounts receivable clerk), Luis (credit manager) and Ana (controller). The audit committee has asked for each proposal below to be tested against the deck’s guidance on cash collections.</p>`,
  ask: "Which proposal still leaves a significant segregation of duties weakness?",
  options: [
    { t: "Kim deposits receipts, Raj posts payments to customer accounts from a remittance list, and Ana reconciles the bank account.", w: "Cash handling, posting to customer accounts and bank reconciliation are held by three different people. This is the structure the deck recommends." },
    { t: "Luis authorizes credit memos and Raj records them.", w: "Authorization is separate from recording, and neither person handles cash." },
    { t: "Customers pay into a bank lockbox, the bank deposits the checks, and Raj posts payments from the bank’s remittance file.", w: "The lockbox removes cash handling from employees entirely, which is one of the deck’s controls." },
    { t: "Kim deposits receipts and also approves credit memos for customer returns.", w: "" }
  ],
  answer: 3,
  explain: "The deck’s first control against theft of cash is to separate cash handling from three duties: posting to customer accounts, authorizing credit memos, and reconciling the bank account. A cashier who can approve credit memos can take a customer’s payment and then write off the balance, hiding the theft."
},
{
  topic: "Cash collections", slides: "Slides 13 and 21",
  title: "Payments applied weeks late",
  case: `<p>At Quillon Instruments, Dana opens the mail, posts customer payments, and makes the bank deposit. You notice that many payments are posted to customer accounts 2 to 3 weeks after the date on the customer’s remittance advice. Several customers complain that their payments were “lost” and later reappeared.</p>`,
  ask: "This pattern suggests lapping. Which control would best prevent or promptly detect it?",
  options: [
    { t: "Have Dana mail monthly statements to customers so that they can confirm their balances.", w: "Statements prepared and mailed by the person committing the fraud can be altered or held back." },
    { t: "Have two employees independent of accounts receivable open the mail and prepare a remittance list, compare that list daily to the deposit slip and to the postings, and deposit all receipts intact each day.", w: "" },
    { t: "Have Dana reconcile the bank statement each month.", w: "Adding bank reconciliation to Dana’s duties makes the segregation problem worse." },
    { t: "Increase the allowance for doubtful accounts for slow-paying customers.", w: "The customers are not slow payers. Their payments are being diverted." }
  ],
  answer: 1,
  explain: "Lapping covers stolen cash by applying later receipts to earlier customers’ accounts, which causes the posting delays seen here. A remittance list prepared at mail opening by people independent of the books creates an independent record of what arrived and when. Daily deposits make the comparison timely. This matches the deck’s controls of segregation and depositing all cash receipts daily."
},
{
  topic: "Cash collections", slides: "Slide 13",
  title: "Is the lockbox worth it?",
  case: `<p>Hollis Manufacturing collects an average of $400,000 per business day from customers across the country, almost all by mailed check. Its bank proposes a lockbox network that would cut collection float by 3 days. The bank’s annual fee is $120,000. Hollis can earn 6% a year on freed-up funds.</p>`,
  ask: "On a purely financial basis, what should Hollis do?",
  options: [
    { t: "Reject the proposal. Freed funds of $1,200,000 earn $72,000 a year, which is less than the $120,000 fee.", w: "" },
    { t: "Accept the proposal. It frees $1,200,000 of cash, which is far more than the $120,000 fee.", w: "This compares a one-time release of funds with an annual cost. The benefit is the return earned on the freed funds, not the funds themselves." },
    { t: "Accept the proposal. The annual benefit is $1,200,000 × 6% × 3 days = $216,000.", w: "The 3 days are already reflected in the $1,200,000. Multiplying by 3 again counts the float reduction twice." },
    { t: "Reject the proposal. A lockbox addresses theft of cash, not cash flow problems.", w: "The deck lists the lockbox as a control for both theft and cash flow problems." }
  ],
  answer: 0,
  explain: "Freed funds are $400,000 × 3 days = $1,200,000. At 6%, that earns $72,000 a year, against a $120,000 fee, a net cost of $48,000. In practice, management might still weigh the control benefit: a lockbox removes cash handling from employees, which reduces the risk of theft. That is a qualitative factor outside this calculation."
},
{
  topic: "Cash collections", slides: "Slide 13",
  title: "Offering 2/10, net 30",
  case: `<p>To ease cash flow problems, the CFO of Barlow Chemicals proposes changing credit terms from net 30 to 2/10, net 30. The treasurer warns that the discount could be an expensive way to raise cash if most customers take it. Use a 365-day year.</p>`,
  ask: "What is the approximate annualized cost to Barlow of each customer who pays on day 10 to take the discount?",
  options: [
    { t: "2.0%", w: "This is the discount rate itself, not annualized. Barlow gives up 2% to receive cash 20 days early." },
    { t: "24.8%", w: "This annualizes over 30 days (365 ÷ 30). The discount buys only 20 days of earlier payment, from day 30 to day 10." },
    { t: "36.5%", w: "This uses 2% ÷ 100%. The customer pays 98% of the invoice, so the effective rate is 2 ÷ 98." },
    { t: "37.2%", w: "" }
  ],
  answer: 3,
  explain: "The effective annual cost is (2 ÷ 98) × (365 ÷ 20) = 2.04% × 18.25 ≈ 37.2%. Discounts for early payment are one of the deck’s controls for cash flow problems. This calculation shows why they belong in the cash flow budget alongside cheaper options such as a lockbox."
},
{
  topic: "Cash collections", slides: "Slides 7 and 21",
  title: "Using the aging report",
  case: `<p>Kestrel Wholesale estimates uncollectible accounts from its accounts receivable aging report. Before year-end adjustment, the allowance for doubtful accounts has a credit balance of $18,000.</p>
  <table class="fig"><tr><th>Age of balance</th><th class="num">Receivables</th><th class="num">Est. uncollectible</th></tr>
  <tr><td>Current</td><td class="num">$500,000</td><td class="num">1%</td></tr>
  <tr><td>1–30 days past due</td><td class="num">$200,000</td><td class="num">4%</td></tr>
  <tr><td>31–60 days past due</td><td class="num">$80,000</td><td class="num">15%</td></tr>
  <tr><td>61–90 days past due</td><td class="num">$40,000</td><td class="num">30%</td></tr>
  <tr><td>Over 90 days past due</td><td class="num">$25,000</td><td class="num">60%</td></tr></table>`,
  ask: "What bad debt expense should Kestrel record for the year?",
  options: [
    { t: "$52,000", w: "This is the required ending allowance. It ignores the $18,000 credit already in the account." },
    { t: "$18,000", w: "This is the existing balance, not the adjustment." },
    { t: "$34,000", w: "" },
    { t: "$70,000", w: "This adds the existing credit balance instead of subtracting it." }
  ],
  answer: 2,
  explain: "Required allowance: $5,000 + $8,000 + $12,000 + $12,000 + $15,000 = $52,000. The account already has an $18,000 credit, so the adjustment is $52,000 − $18,000 = $34,000. A growing over-90 bucket is a signal for the credit department to revisit credit limits, the deck’s control for uncollectible accounts."
},
{
  topic: "Cash collections", slides: "Slide 21",
  title: "Unapplied cash from electronic payments",
  case: `<p>Most of Rowan Logistics’ large customers now pay by electronic funds transfer. The payment arrives at the bank, but the detail of which invoices it covers comes separately, by email or in a later file. Unapplied cash has grown to $2.3 million, and the collections team spends days matching payments to invoices.</p><p>Rowan already exchanges orders and invoices with these customers through EDI.</p>`,
  ask: "Which approach best addresses this problem?",
  options: [
    { t: "Issue customers a universal payment identification code (UPIC).", w: "A UPIC lets customers pay without knowing Rowan’s actual bank account number. It protects that number but does not combine payment with remittance data." },
    { t: "Financial electronic data interchange (FEDI), which sends the funds transfer and the remittance data together.", w: "" },
    { t: "An electronic lockbox at Rowan’s bank.", w: "A lockbox handles mailed checks. These customers already pay electronically." },
    { t: "A customer relationship management (CRM) system.", w: "CRM supports sales and customer service. It does not match payments to invoices." }
  ],
  answer: 1,
  explain: "FEDI integrates EFT with EDI, so the payment and its remittance data travel in one transmission. Since Rowan already uses EDI for orders and invoices, FEDI completes an end-to-end electronic cycle: payments can be applied automatically to the right invoices without manual matching."
}
];

const TOPICS = ["Sales order entry","Shipping","Billing","Cash collections"];
const LETTERS = ["A","B","C","D"];
const PASS = 75;
const app = document.getElementById("app");
let S = null;

const TICK = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 21 C11 23 14 27 16 31 C20 21 26 12 33 7" fill="none" stroke="var(--ledger)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 9 C17 17 23 24 31 32 M31 9 C24 16 17 24 9 31" fill="none" stroke="var(--pencil)" stroke-width="3.4" stroke-linecap="round"/></svg>';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wrapTables(html){return html.replace(/<table class="fig">/g,'<div class="tablewrap"><table class="fig">').replace(/<\/table>/g,'</table></div>');}

function newSession(doShuffle){
  const idx = QUESTIONS.map((_,i)=>i);
  S = { order: doShuffle ? shuffle(idx) : idx, pos: 0, picks: {}, done: {} };
}
function counts(){
  let right=0, answered=0;
  for(const k in S.done){answered++; if(S.picks[k]===QUESTIONS[k].answer) right++;}
  return {right, answered};
}

function renderStart(){
  const t = TOPICS.map(tp=>QUESTIONS.filter(q=>q.topic===tp).length);
  app.innerHTML = `
  <section class="start">
    <h2>Read each case, choose an answer, then check it.</h2>
    <p>Every question puts a revenue cycle threat inside a realistic business situation. Several answer choices are real controls from the deck, so the challenge is picking the one that addresses the specific threat in the case.</p>
    <p>After you submit, you will see the correct answer, why each other choice falls short, and the slide it comes from. A score of ${PASS}% or higher is a pass, the same threshold as the CPA exam.</p>
    <div class="legend">
      ${TOPICS.map((tp,i)=>`<div><b>${t[i]}</b><span>${tp}</span></div>`).join("")}
    </div>
    <label class="check"><input type="checkbox" id="shuf"> Shuffle the question order</label>
    <button class="btn" id="go" type="button">Start the review</button>
  </section>`;
  document.getElementById("go").onclick = ()=>{ newSession(document.getElementById("shuf").checked); renderQuiz(); };
}

function cellHTML(qi, n){
  const done = S.done[qi], ok = done && S.picks[qi]===QUESTIONS[qi].answer;
  const cls = ["cell", n===S.pos?"current":"", done?(ok?"ok":"bad"):""].join(" ");
  const label = `Question ${n+1}${done?(ok?", correct":", incorrect"):", not answered"}`;
  return `<button type="button" class="${cls}" data-n="${n}" aria-label="${label}">${n+1}${done?(ok?TICK:CROSS):""}</button>`;
}

function renderQuiz(){
  const qi = S.order[S.pos], q = QUESTIONS[qi];
  const done = !!S.done[qi], pick = S.picks[qi];
  const c = counts();
  const isRight = done && pick===q.answer;

  const opts = q.options.map((o,i)=>{
    let cls="opt";
    if(!done && pick===i) cls+=" sel";
    if(done && i===q.answer) cls+=" right";
    if(done && i===pick && pick!==q.answer) cls+=" wrong";
    const why = done && i!==q.answer && o.w ? `<span class="why">${o.w}</span>` : "";
    return `<li><button type="button" class="${cls}" data-i="${i}" ${done?"disabled":""} aria-pressed="${pick===i}">
      <span class="letter">${LETTERS[i]}</span><span>${o.t}${why}</span></button></li>`;
  }).join("");

  const verdict = done ? `
    <div class="verdict ${isRight?"ok":"bad"}" role="status">
      ${isRight?TICK:CROSS}
      <div>
        <h4>${isRight?"Correct.":`Not quite. The answer is ${LETTERS[q.answer]}.`}</h4>
        <p>${q.explain}</p>
        <p class="src">Source: ${q.slides} of the revenue cycle deck</p>
      </div>
    </div>` : "";

  const last = S.pos===S.order.length-1;
  const allDone = c.answered===QUESTIONS.length;
  const actions = done
    ? `${!last?`<button class="btn" id="next" type="button">Next question</button>`:""}
       ${allDone?`<button class="btn ${last?"":"ghost"}" id="res" type="button">See your results</button>`:""}
       ${S.pos>0?`<button class="btn ghost" id="prev" type="button">Previous</button>`:""}`
    : `<button class="btn" id="submit" type="button" ${pick===undefined?"disabled":""}>Submit answer</button>
       ${S.pos>0?`<button class="btn ghost" id="prev" type="button">Previous</button>`:""}
       <span class="hint">Keys: A to D to choose, Enter to submit</span>`;

  app.innerHTML = `
  <div class="board">
    <aside class="side">
      <h3>Progress</h3>
      <div class="grid">${S.order.map((qx,n)=>cellHTML(qx,n)).join("")}</div>
      <div class="tally">
        <div><span class="k">Answered</span><span>${c.answered} of ${QUESTIONS.length}</span></div>
        <div><span class="k">Correct</span><span>${c.right}</span></div>
        <div><span class="k">Score so far</span><span>${c.answered?Math.round(c.right/c.answered*100)+"%":"–"}</span></div>
      </div>
      ${c.answered>0?`<button class="btn ghost finish" id="end" type="button">${allDone?"See your results":"Finish and score"}</button>`:""}
    </aside>
    <section>
      <div class="qhead"><span>Question ${S.pos+1} of ${QUESTIONS.length}</span><span class="topic">${q.topic}</span></div>
      <h2 class="qtitle">${q.title}</h2>
      <div class="case">${wrapTables(q.case)}</div>
      <p class="ask">${q.ask}</p>
      <ul class="opts">${opts}</ul>
      ${verdict}
      <div class="actions">${actions}</div>
    </section>
  </div>`;

  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(S.done[qi])return; S.picks[qi]=+b.dataset.i; renderQuiz(); });
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ S.pos=+b.dataset.n; renderQuiz(); window.scrollTo({top:0}); });
  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn;};
  on("submit",submit);
  on("next",()=>{S.pos++;renderQuiz();window.scrollTo({top:0});});
  on("prev",()=>{S.pos--;renderQuiz();window.scrollTo({top:0});});
  on("res",renderResults); on("end",renderResults);
}

function submit(){
  const qi=S.order[S.pos];
  if(S.picks[qi]===undefined || S.done[qi]) return;
  S.done[qi]=true; renderQuiz();
  const v=app.querySelector(".verdict"); if(v) v.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"});
}

function renderResults(){
  const c = counts(), total = QUESTIONS.length;
  const pct = Math.round(c.right/total*100);
  const pass = pct>=PASS;
  const bars = TOPICS.map(tp=>{
    const ids = QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].topic===tp);
    const r = ids.filter(i=>S.done[i] && S.picks[i]===QUESTIONS[i].answer).length;
    return `<div class="bar"><span>${tp}</span><div class="track"><div class="fill" style="width:${r/ids.length*100}%"></div></div><span>${r} of ${ids.length}</span></div>`;
  }).join("");
  const missed = S.order.map((qi,n)=>({qi,n})).filter(x=>!(S.done[x.qi] && S.picks[x.qi]===QUESTIONS[x.qi].answer));
  app.innerHTML = `
  <section class="results">
    <h2>Your results</h2>
    <div class="scoreline">
      <div class="big">${c.right}<small> / ${total}</small></div>
      <div><div class="status ${pass?"pass":"fail"}">${pct}%: ${pass?"Pass":"Below the 75% passing mark"}</div>
      <div class="hint">${c.answered<total?`${total-c.answered} unanswered questions count as incorrect.`:"All questions answered."}</div></div>
    </div>
    <div class="bars">${bars}</div>
    ${missed.length?`<h3>Review these questions</h3><ul class="missed">${missed.map(x=>`<li><button type="button" data-n="${x.n}"><span class="n">${x.n+1}</span><span>${QUESTIONS[x.qi].title}${S.done[x.qi]?"":" (not answered)"}</span></button></li>`).join("")}</ul>`:`<p>You answered every question correctly.</p>`}
    <div class="actions">
      <button class="btn" id="retake" type="button">Retake with shuffled order</button>
      <button class="btn ghost" id="back" type="button">Back to the questions</button>
    </div>
  </section>`;
  app.querySelectorAll(".missed button").forEach(b=>b.onclick=()=>{S.pos=+b.dataset.n;renderQuiz();window.scrollTo({top:0});});
  document.getElementById("retake").onclick=()=>{newSession(true);renderQuiz();window.scrollTo({top:0});};
  document.getElementById("back").onclick=()=>{renderQuiz();};
  window.scrollTo({top:0});
}

document.addEventListener("keydown",e=>{
  if(!S || !document.querySelector(".opts")) return;
  if(e.target.closest && e.target.closest("input,textarea")) return;
  const qi=S.order[S.pos];
  const k=e.key.toUpperCase();
  const i=LETTERS.indexOf(k);
  if(i>=0 && !S.done[qi] && !e.metaKey && !e.ctrlKey){S.picks[qi]=i;renderQuiz();}
  else if(e.key==="Enter" && !(e.target.tagName==="BUTTON")){
    if(!S.done[qi]) submit();
    else if(S.pos<S.order.length-1){S.pos++;renderQuiz();window.scrollTo({top:0});}
  }
});

document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

renderStart();
</script>
</body>
</html>
